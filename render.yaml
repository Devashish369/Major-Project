# Render Blueprint (New + -> Blueprint -> pick this repo).  No Docker needed.
# Secrets are NOT stored here: values marked `sync: false` are typed into the Render dashboard.
#
# FREE TIER ONLY – nothing here costs money (see docs/FREE_TIER.md):
#   plan: free web service (750 free hours/month, sleeps after 15 idle min) + free static site.
#   No disks, no workers, no cron jobs, no paid instance types.
#   buildFilter: a push that only changes docs/ or scripts/ does NOT rebuild anything, so the
#   monthly free build minutes last.  Do not add a payment method: without one Render can only
#   pause services when a free limit is reached, never bill.
services:
  # ── Backend: FastAPI ──────────────────────────────────────────────────────
  - type: web
    name: intellipm-api
    runtime: python
    rootDir: backend
    plan: free
    buildFilter:                     # rebuild the API only when backend code changes
      paths:
        - backend/**
      ignoredPaths:
        - backend/tests/**
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/v1/health
    envVars:
      - key: PYTHON_VERSION          # must match the version the ML artifacts were built with
        value: 3.13.13
      - key: DATABASE_URL            # Neon / Supabase / Render Postgres connection string
        sync: false
      - key: SECRET_KEY
        generateValue: true
      - key: CORS_ORIGINS            # the frontend URL, e.g. https://intellipm-web.onrender.com
        sync: false
      - key: LLM_API_KEY
        sync: false
      - key: LLM_FALLBACK_API_KEY
        sync: false
      - key: LLM_BASE_URL
        value: https://api.groq.com/openai/v1
      - key: LLM_MODEL
        value: openai/gpt-oss-120b
      - key: LLM_FALLBACK_BASE_URL
        value: https://generativelanguage.googleapis.com/v1beta/openai/
      - key: LLM_FALLBACK_MODEL
        value: gemini-flash-latest
      - key: USE_CACHED_PLAN_ONLY
        value: "false"
      - key: HOURS_PER_STORY_POINT
        value: "3"

  # ── Frontend: static React build ──────────────────────────────────────────
  - type: web
    name: intellipm-web
    runtime: static
    rootDir: frontend
    buildFilter:                     # rebuild the site only when frontend code changes
      paths:
        - frontend/**
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    envVars:
      - key: NODE_VERSION
        value: 22
      - key: VITE_API_BASE_URL       # https://<intellipm-api URL>/api/v1  (set after the API exists)
        sync: false
    routes:
      - type: rewrite                # React Router: every path serves index.html
        source: /*
        destination: /index.html
    # Browser security headers for the website (network security).  connect-src must list the
    # API address: if the API service ever gets a different URL, update the two entries below.
    headers:
      - path: /*
        name: Content-Security-Policy
        value: "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com data:; img-src 'self' data:; connect-src 'self' https://intellipm-api.onrender.com wss://intellipm-api.onrender.com; frame-ancestors 'none'; base-uri 'self'; form-action 'self'; object-src 'none'"
      - path: /*
        name: X-Frame-Options
        value: DENY
      - path: /*
        name: X-Content-Type-Options
        value: nosniff
      - path: /*
        name: Referrer-Policy
        value: strict-origin-when-cross-origin
      - path: /*
        name: Permissions-Policy
        value: "camera=(), microphone=(), geolocation=(), payment=()"
      - path: /assets/*              # file names contain a content hash: safe to cache for a year
        name: Cache-Control
        value: public, max-age=31536000, immutable
